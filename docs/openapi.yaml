        summary:
          type: [string, "null"]
        description:
          type: [string, "null"]
        passthrough:
          type: [boolean, "null"]
        reversibility:
          description: Omitted preserves the existing capability contract; null clears it; an object replaces it.
          oneOf:
            - $ref: "#/components/schemas/ReversibilityConfig"
            - type: "null"
    UndoEntrySummary:
      type: object
      required: [undo_id, tenant_id, forward_capability, inverse_capability, created_at_ms, expires_at_ms, status]
      description: Safe summary excluding snapshot values and resolved inverse arguments.
      properties:
        undo_id: { type: string }
        tenant_id: { type: string }
        operation_id: { type: [string, "null"] }
        work_item_id: { type: [string, "null"] }
        profile_id: { type: [string, "null"] }
        actor_id: { type: [string, "null"] }
        forward_capability: { type: string }
        inverse_capability: { type: string }
        change_preview:
          type: array
          items: { type: string }
        snapshot_artifact_hash: { type: [string, "null"] }
        created_at_ms: { type: integer }
        expires_at_ms: { type: integer }
        status:
          type: string
          enum: [armed, executing, reverted, expired, failed]
    UndoListResponse:
      type: object
      required: [entries, total, offset, limit]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/UndoEntrySummary"
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200 }
    RollbackResult:
      type: object
      required: [undo_id, operation_id, capability, ok, error, forced_expired]
      properties:
        undo_id: { type: string }
        operation_id: { type: [string, "null"] }
        capability: { type: string }
        ok: { type: boolean }
        error: { type: [string, "null"] }
        error_code: { type: string }
        output: {}
        audit_event_id: { type: string }
        audit_hash: { type: string }
        audit_error:
          type: string
          description: Audit persistence failure, independent of the upstream inverse outcome.
        forced_expired: { type: boolean }
        entry_status:
          type: string
          enum: [armed, executing, reverted, expired, failed]
    ReversibilityDraftRequest:
      type: object
      additionalProperties: false
      required: [forward, ttlSecs, preSnapshot, inverse, preUndoCheck, testTarget]
      properties:
        forward:
          type: string
        ttlSecs:
          type: integer
          minimum: 1
        preSnapshot:
          $ref: "#/components/schemas/UndoReadConfig"
        preUndoCheck:
          $ref: "#/components/schemas/UndoReadConfig"
        inverse:
          $ref: "#/components/schemas/UndoInverseConfig"
        testTarget:
          $ref: "#/components/schemas/ReversibilityConfig/properties/testTarget"
    ReversibilityConfig:
      type: object
      required: [class]
      properties:
        class:
          type: string
          enum: [delayable, reversible, compensable, irreversible]
        holdWindowSecs:
          type: integer
          minimum: 1
          description: Delayable hold duration in seconds.
        ttlSecs:
          type: integer
          minimum: 1
          default: 3600
          description: Lifetime of a registered undo action in seconds.
        dailyLimit:
          type: integer
          minimum: 1
          description: Required rolling daily limit for compensable calls.
        preSnapshot:
          $ref: "#/components/schemas/UndoReadConfig"
        preUndoCheck:
          $ref: "#/components/schemas/UndoReadConfig"
        testTarget:
          type: object
          required: [server, args]
          properties:
            server:
              type: string
              minLength: 1
            args:
              type: object
          additionalProperties: false
        inverse:
          $ref: "#/components/schemas/UndoInverseConfig"
      allOf:
        - if:
            properties:
              class: { enum: [reversible, compensable] }
            required: [class]
          then:
            required: [inverse]
        - if:
            properties:
              class: { const: compensable }
            required: [class]
          then:
            required: [dailyLimit]
        - if:
            properties:
              class: { not: { const: delayable } }
            required: [class]
          then:
            not: { required: [holdWindowSecs] }
        - if:
            properties:
              class: { not: { const: compensable } }
            required: [class]
          then:
            not: { required: [dailyLimit] }
        - if:
            properties:
              class: { enum: [delayable, irreversible] }
            required: [class]
          then:
            not:
              anyOf:
                - { required: [ttlSecs] }
                - { required: [preSnapshot] }
                - { required: [preUndoCheck] }
                - { required: [testTarget] }
                - { required: [inverse] }
        - if:
            required: [testTarget]
          then:
            required: [preSnapshot]
      additionalProperties: false
    UndoReadConfig:
      type: object
      required: [capability, args]
      properties:
        capability:
          type: string
          minLength: 1
        args:
          type: object
        captureJsonPath:
          type: string
      additionalProperties: false
    UndoInverseConfig:
      type: object
      required: [capability, args]
      properties:
        capability:
          type: string
          minLength: 1
        args:
          type: object
      additionalProperties: false
    WebhookConfig:
      type: object
      required: [url]
      properties:
        url:
          type: string
        secret:
          type: [string, "null"]
        secretEnv:
          type: [string, "null"]
        authHeader:
          type: [string, "null"]
        headers:
          type: object
          additionalProperties:
            type: string
        events:
          type: array
          items: { type: string }
          description: ChatOps action events must be explicitly listed to enable buttons, including when this list is empty.
        callbackUrl:
          type: string
          format: uri
        actionRole:
          type: string
        approvalTenant:
          type: string
        slackSigningSecret:
          type: string
          writeOnly: true
        slackSigningSecretEnv:
          type: string
    PolicyConfig:
      type: object
      properties:
        allow:
          type: array
          items:
            type: string
        deny:
          type: array
          items:
            type: string
        requireApproval:
          type: array
          items:
            type: string
        approvalTimeoutSecs:
          type: integer
        redactKeys:
          type: array
          items:
            type: string
        resultSanitization:
          $ref: "#/components/schemas/ResultSanitization"
        holdWindowSecs:
          type: integer
          minimum: 1
        webhook:
          $ref: "#/components/schemas/WebhookConfig"
    ResultSanitization:
      type: object
      additionalProperties: false
      properties:
        fieldNames:
          type: array
          items: {type: string, minLength: 1}
        patterns:
          type: array
          maxItems: 64
          description: At most 4 KiB of UTF-8 per pattern and 16 KiB across the set. Nesting and compiled size are also bounded.
          items: {type: string, maxLength: 4096}
        opaqueExceptions:
          type: array
          items:
            type: object
            required: [server, kind, mimeType]
            additionalProperties: false
            properties:
              server: {type: string}
              kind: {type: string, enum: [image, audio, blob]}
              mimeType: {type: string}
    DecisionReceipt:
      type: object
      required: [ticket_id, decision, principal, decided_at, argument_digest]
      properties:
        ticket_id: {type: string}
        decision: {type: string, enum: [approve, reject]}
        principal: {type: string}
        decided_at: {type: integer}
        argument_digest: {type: string}
    DecisionReceiptResponse:
      type: object
      required: [ok, receipt]
      properties:
        ok: {type: boolean}
        receipt:
          $ref: "#/components/schemas/DecisionReceipt"
    ApprovalTicket:
      type: object
      required: [id, capability_id, server_id, sanitized_args, status, created_at, expires_at]
      properties:
        id: {type: string}
        capability_id: {type: string}
        server_id: {type: string}
        sanitized_args: {type: object}
        task_id: {type: [string, "null"]}
        status: {type: string, enum: [pending, approved, rejected, expired]}
        created_at: {type: integer}
        expires_at: {type: integer}
        decision_receipt:
          oneOf:
            - $ref: "#/components/schemas/DecisionReceipt"
            - type: "null"
        receipt_delivery: {type: [string, "null"], enum: [delivered, failed, null]}
        execution_status: {type: [string, "null"]}
        upstream_execution_state: {type: [string, "null"]}
    ListApprovalsResponse:
      type: object
      required: [ok, approvals, total]
      properties:
        ok:
          type: boolean
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalTicket"
        total:
          type: integer
    GetApprovalResponse:
      type: object
      required: [ok, approval]
      properties:
        ok:
          type: boolean
        approval:
          $ref: "#/components/schemas/ApprovalTicket"
    ApproveTicketRequest:
      type: object
      properties:
        operator:
          type: string
          deprecated: true
        modified_args:
          type: object
    RejectTicketRequest:
      type: object
      properties:
        operator:
          type: string
          deprecated: true
        reason:
          type: string
    SuccessEnvelope:
      type: object
      required: [ok, request_id, trace_id, data, error, retry]
      properties:
        ok:
          type: boolean
          const: true
        request_id:
          type: [string, "null"]
        trace_id:
          type: string
        context:
          $ref: "#/components/schemas/RequestContext"
        retry:
          $ref: "#/components/schemas/RetryMetadata"
        data: {}
        error:
          type: "null"
    ErrorEnvelope:
      type: object
      required: [ok, request_id, trace_id, data, error, retry]
      properties:
        ok:
          type: boolean
          const: false
        request_id:
          type: [string, "null"]
        trace_id:
          type: string
        context:
          $ref: "#/components/schemas/RequestContext"
        retry:
          $ref: "#/components/schemas/RetryMetadata"
        data:
          type: "null"
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              description: Machine-readable failure code. Examples are illustrative and additional codes may be returned.
              examples:
                - TOOL_NOT_FOUND
                - RESOURCE_NOT_FOUND
                - PROMPT_NOT_FOUND
                - SERVER_UNREACHABLE
                - INVALID_ARGS
                - UPSTREAM_TIMEOUT
                - UPSTREAM_ERROR
                - RESULT_WITHHELD
                - TOOL_DEFINITION_UNAPPROVED
                - POLICY_DENIED
                - APPROVAL_PENDING
                - APPROVAL_TIMEOUT
                - APPROVAL_REJECTED
                - CIRCUIT_OPEN
                - OPERATION_CANCELLED
                - INTERNAL_ERROR
                - PRE_SNAPSHOT_FAILED
                - UNDO_STATE_DRIFT
                - UNDO_STATE_CHECK_FAILED
                - UNDO_WINDOW_EXPIRED
                - UNDO_PERSISTENCE_FAILED
                - AUDIT_PERSISTENCE_FAILED
                - EMISSION_DISPATCHING
                - EMISSION_OUTCOME_UNKNOWN
            message:
              type: string
            retryable:
              type: boolean
    ResilienceConfig:
      type: object
      properties:
        failureThreshold:
          type: integer
          default: 3
          description: Consecutive failure threshold before tripping circuit to Open
        cooldownMs:
          type: integer
          default: 30000
          description: Cooldown duration in milliseconds before testing recovery in HalfOpen
        consecutiveSuccesses:
          type: integer
          default: 2
          description: Consecutive successful probes in HalfOpen to reset circuit to Closed
        autoRestart:
          type: boolean
          default: true
          description: Automatically restart crashed stdio child processes
        maxRestarts:
          type: integer
          default: 5
          description: Maximum restart attempts before giving up
        healthCheckIntervalSecs:
          type: [integer, "null"]
    BatchStep:
      type: object
      required: [id, capability_id, args]
      properties:
        id:
          type: string
          description: Unique step identifier within the batch (e.g. step1)
        capability_id:
          type: string
          description: Capability ID to invoke
        args:
          type: object
          description: Arguments object, supporting $step_id.field reference interpolation
        continue_on_error:
          type: boolean
          default: false
          description: Whether to continue executing subsequent steps if this step fails
    BatchCallRequest:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/BatchStep"
        request_id:
          type: [string, "null"]
        autoRollbackOnFailure:
          type: boolean
          default: false
          description: Stop at the first failed step and attempt eligible inverses in reverse order.
        context:
          $ref: "#/components/schemas/RequestContext"
    BatchStepResult:
      type: object
      required: [id, capability_id, ok, duration_us]
      properties:
        id:
          type: string
        capability_id:
          type: string
        ok:
          type: boolean
        data: {}
        error:
          type: [string, "null"]
        duration_us:
          type: integer
    BatchCallResponse:
      type: object
      required: [ok, trace_id, results, total_duration_us]
      properties:
        ok:
          type: boolean
        request_id:
          type: [string, "null"]
        trace_id:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/BatchStepResult"
        rollback_results:
          type: array
          items:
            $ref: "#/components/schemas/RollbackResult"
        total_duration_us:
          type: integer
    IdempotencyRecord:
      type: object
      required: [key, response, created_at_epoch_secs, replay_count]
      properties:
        key:
          type: string
          description: Idempotency key
        capability_id:
          type: [string, "null"]
          description: Target capability ID
        response:
          type: object
          description: Cached execution response or a policy withholding error
        result_policy_revision:
          type: string
          description: Sanitization revision used to produce the stored response
        result_access:
          type: object
          properties:
            tenant_id: {type: string}
            profile_id: {type: [string, "null"]}
        created_at_epoch_secs:
          type: integer
          description: Unix timestamp when key was initialized
        completed_at_epoch_secs:
          type: [integer, "null"]
          description: Unix timestamp when execution completed
        replay_count:
          type: integer
          description: Number of times this cached response was replayed
        first_trace_id:
          type: [string, "null"]
          description: Trace ID of the initial execution attempt

