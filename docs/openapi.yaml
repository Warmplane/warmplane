openapi: 3.1.0
info:
  title: Warmplane HTTP Facade API
  version: "v1"
  description: |
    Warmplane exposes a compact, deterministic HTTP facade over multiple upstream MCP servers.

    This API is index-first: list compact capability/resource/prompt entries, then request detail
    or execute operations on-demand.
servers:
  - url: http://127.0.0.1:9090
    description: local default
paths:
  /v1/capabilities:
    get:
      summary: List capabilities
      operationId: listCapabilities
      responses:
        "200":
          description: Capability index with cache hints
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesListResponse"
        "304":
          description: Not Modified (catalog unchanged)
  /v1/capabilities/search:
    post:
      summary: Search capabilities
      operationId: searchCapabilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchCapabilitiesRequest"
      responses:
        "200":
          description: Ranked search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchCapabilitiesResponse"
  /v1/capabilities/{id}:
    get:
      summary: Describe capability
      operationId: describeCapability
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Capability detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityDescribeResponse"
        "404":
          description: Capability not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/tools/call:
    post:
      summary: Execute capability
      operationId: callCapability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallCapabilityRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Policy blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Capability not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/resources:
    get:
      summary: List resources
      operationId: listResources
      responses:
        "200":
          description: Resource index with cache hints
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcesListResponse"
        "304":
          description: Not Modified (catalog unchanged)
  /v1/resources/read:
    post:
      summary: Read resource
      operationId: readResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadResourceRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Policy blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/resources/updates:
    get:
      summary: Real-time resource update SSE feed
      operationId: resourceUpdates
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
  /v1/prompts:
    get:
      summary: List prompts
      operationId: listPrompts
      responses:
        "200":
          description: Prompt index with cache hints
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptsListResponse"
        "304":
          description: Not Modified (catalog unchanged)
  /v1/prompts/get:
    post:
      summary: Get prompt output
      operationId: getPrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetPromptRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Policy blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Prompt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/catalog/events:
    get:
      summary: Catalog mutation events change feed
      operationId: catalogEvents
      parameters:
        - in: query
          name: after
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Event log feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEventsResponse"
  /v1/completion/complete:
    post:
      summary: Argument completion for prompt or resource
      operationId: completeArgument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: Completion candidate results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResponse"
  /v1/sampling/create_message:
    post:
      summary: Sampling completion delegation
      operationId: samplingCreateMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamplingRequest"
      responses:
        "200":
          description: Sampling response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamplingResponse"
  /v1/operations/{id}/cancel:
    post:
      summary: Cancel in-flight operation
      operationId: cancelOperation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Operation cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                  cancelled:
                    type: boolean
components:
  schemas:
    CapabilityListItem:
      type: object
      required: [id, summary, server, tool, tags]
      properties:
        id:
          type: string
        summary:
          type: string
        server:
          type: string
        tool:
          type: string
        tags:
          type: array
          items:
            type: string
    ResourceListItem:
      type: object
      required: [id, server, uri, name, tags]
      properties:
        id:
          type: string
        server:
          type: string
        uri:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        mime_type:
          type: [string, "null"]
        tags:
          type: array
          items:
            type: string
    PromptListItem:
      type: object
      required: [id, server, name, arguments, tags]
      properties:
        id:
          type: string
        server:
          type: string
        name:
          type: string
        title:
          type: [string, "null"]
        description:
          type: [string, "null"]
        arguments:
          type: array
          items:
            type: object
        tags:
          type: array
          items:
            type: string
    CapabilitiesListResponse:
      type: object
      required: [version, catalog_version, ttl_ms, cache_scope, capabilities]
      properties:
        version:
          type: string
          const: v1
        catalog_version:
          type: string
        ttl_ms:
          type: integer
          example: 300000
        cache_scope:
          type: string
          example: "public"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityListItem"
    CapabilityDescribeResponse:
      type: object
      required: [version, capability]
      properties:
        version:
          type: string
          const: v1
        catalog_version:
          type: string
        capability:
          type: object
          required: [id, server, tool, description, input_schema, examples]
          properties:
            id:
              type: string
            server:
              type: string
            tool:
              type: string
            description:
              type: string
            input_schema:
              type: object
            examples:
              type: array
              items: {}
    ResourcesListResponse:
      type: object
      required: [version, catalog_version, ttl_ms, cache_scope, resources]
      properties:
        version:
          type: string
          const: v1
        catalog_version:
          type: string
        ttl_ms:
          type: integer
          example: 300000
        cache_scope:
          type: string
          example: "public"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceListItem"
    PromptsListResponse:
      type: object
      required: [version, catalog_version, ttl_ms, cache_scope, prompts]
      properties:
        version:
          type: string
          const: v1
        catalog_version:
          type: string
        ttl_ms:
          type: integer
          example: 300000
        cache_scope:
          type: string
          example: "public"
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/PromptListItem"
    SearchCapabilitiesRequest:
      type: object
      properties:
        query:
          type: [string, "null"]
        limit:
          type: integer
          default: 8
        server_ids:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        modes:
          type: array
          items:
            type: string
    SearchCapabilitiesResponse:
      type: object
      required: [version, catalog_version, capabilities]
      properties:
        version:
          type: string
        catalog_version:
          type: string
        capabilities:
          type: array
          items:
            type: object
    CallCapabilityRequest:
      type: object
      required: [capability_id, args]
      properties:
        capability_id:
          type: string
        args:
          type: object
        request_id:
          type: [string, "null"]
        context:
          $ref: "#/components/schemas/RequestContext"
        idempotency_key:
          type: [string, "null"]
        input_responses:
          type: [object, "null"]
          description: MRTR client responses for interactive tool turns
        request_state:
          type: [string, "null"]
          description: MRTR opaque state string
    ReadResourceRequest:
      type: object
      required: [resource_id]
      properties:
        resource_id:
          type: string
        request_id:
          type: [string, "null"]
        context:
          $ref: "#/components/schemas/RequestContext"
        idempotency_key:
          type: [string, "null"]
        input_responses:
          type: [object, "null"]
        request_state:
          type: [string, "null"]
    GetPromptRequest:
      type: object
      required: [prompt_id]
      properties:
        prompt_id:
          type: string
        arguments:
          type: [object, "null"]
        request_id:
          type: [string, "null"]
        context:
          $ref: "#/components/schemas/RequestContext"
        idempotency_key:
          type: [string, "null"]
        input_responses:
          type: [object, "null"]
        request_state:
          type: [string, "null"]
    CompletionRequest:
      type: object
      required: [ref_type, ref_name, argument_name]
      properties:
        ref_type:
          type: string
          enum: [prompt, resource]
        ref_name:
          type: string
        argument_name:
          type: string
        argument_value:
          type: string
    CompletionResponse:
      type: object
      properties:
        ok:
          type: boolean
        trace_id:
          type: string
        data:
          type: object
    SamplingRequest:
      type: object
      required: [server_id, messages]
      properties:
        server_id:
          type: string
        messages:
          type: array
          items:
            type: object
        max_tokens:
          type: [integer, "null"]
    SamplingResponse:
      type: object
      properties:
        ok:
          type: boolean
        trace_id:
          type: string
        data:
          type: object
    CatalogEventsResponse:
      type: object
      required: [catalog_version, cursor, events]
      properties:
        catalog_version:
          type: string
        cursor:
          type: string
        events:
          type: array
          items:
            type: object
    RequestContext:
      type: object
      properties:
        operation_id:
          type: [string, "null"]
        work_item_id:
          type: [string, "null"]
        actor_id:
          type: [string, "null"]
        grant_id:
          type: [string, "null"]
    RetryMetadata:
      type: object
      required: [classification, upstream_execution_state]
      properties:
        classification:
          type: string
          enum: [safe, unsafe, idempotent]
        upstream_execution_state:
          type: string
          enum: [not_started, completed, unknown]
    SuccessEnvelope:
      type: object
      required: [ok, request_id, trace_id, data, error, retry]
      properties:
        ok:
          type: boolean
          const: true
        request_id:
          type: [string, "null"]
        trace_id:
          type: string
        context:
          $ref: "#/components/schemas/RequestContext"
        retry:
          $ref: "#/components/schemas/RetryMetadata"
        data: {}
        error:
          type: "null"
    ErrorEnvelope:
      type: object
      required: [ok, request_id, trace_id, data, error, retry]
      properties:
        ok:
          type: boolean
          const: false
        request_id:
          type: [string, "null"]
        trace_id:
          type: string
        context:
          $ref: "#/components/schemas/RequestContext"
        retry:
          $ref: "#/components/schemas/RetryMetadata"
        data:
          type: "null"
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum:
                - TOOL_NOT_FOUND
                - RESOURCE_NOT_FOUND
                - PROMPT_NOT_FOUND
                - SERVER_UNREACHABLE
                - INVALID_ARGS
                - UPSTREAM_TIMEOUT
                - UPSTREAM_ERROR
                - OPERATION_CANCELLED
                - INTERNAL_ERROR
            message:
              type: string
            retryable:
              type: boolean
