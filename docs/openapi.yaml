openapi: 3.1.0
info:
  title: Warmplane HTTP Facade API
  version: "v1"
  description: |
    Warmplane exposes a compact, deterministic HTTP facade over multiple upstream MCP servers.

    This API is index-first: list compact capability/resource/prompt entries, then request detail
    or execute operations on-demand.
servers:
  - url: http://127.0.0.1:9090
    description: local default
paths:
  /v1/capabilities:
    get:
      summary: List capabilities
      operationId: listCapabilities
      parameters:
        - in: query
          name: profile
          required: false
          schema:
            type: string
          description: Named server constellation profile ID
        - in: header
          name: X-Warmplane-Profile
          required: false
          schema:
            type: string
          description: Named server constellation profile ID
      responses:
        "200":
          description: Capability index with cache hints
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesListResponse"
        "304":
          description: Not Modified (catalog unchanged)
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/capabilities/search:
    post:
      summary: Search capabilities
      operationId: searchCapabilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchCapabilitiesRequest"
      responses:
        "200":
          description: Ranked search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchCapabilitiesResponse"
  /v1/capabilities/{id}:
    get:
      summary: Describe capability
      operationId: describeCapability
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Capability detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityDescribeResponse"
        "404":
          description: Capability not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/tools/call:
    post:
      summary: Execute capability
      operationId: callCapability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallCapabilityRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "202":
          description: Delayable execution accepted as a task receipt
          content:
            application/json:
              schema:
                type: object
                required: [ok, resultType, task]
                properties:
                  ok:
                    type: boolean
                  resultType:
                    type: string
                    const: task
                  task:
                    $ref: "#/components/schemas/TaskResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Policy blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Capability not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/tools/batch_call:
    post:
      summary: Execute chained multi-step batch capabilities
      operationId: batchCallCapabilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCallRequest"
      responses:
        "200":
          description: Batch execution summary response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCallResponse"
  /v1/idempotency/records:
    get:
      summary: List cached idempotency records
      operationId: listIdempotencyRecords
      parameters:
        - name: limit
          in: query
          description: Max records to return (default 50)
          schema:
            type: integer
        - name: offset
          in: query
          description: Record offset (default 0)
          schema:
            type: integer
      responses:
        "200":
          description: List of cached idempotency records
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/IdempotencyRecord"
                  limit:
                    type: integer
                  offset:
                    type: integer
  /v1/idempotency/records/{key}:
    get:
      summary: Get details for a specific idempotency record
      operationId: getIdempotencyRecord
      parameters:
        - name: key
          in: path
          required: true
          description: Idempotency key
          schema:
            type: string
      responses:
        "200":
          description: Single cached idempotency record
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  record:
                    $ref: "#/components/schemas/IdempotencyRecord"
        "404":
          description: Record not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/resources:
    get:
      summary: List resources
      operationId: listResources
      responses:
        "200":
          description: Resource index with cache hints
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcesListResponse"
        "304":
          description: Not Modified (catalog unchanged)
  /v1/resources/read:
    post:
      summary: Read resource
      operationId: readResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadResourceRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Policy blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/resources/updates:
    get:
      summary: Real-time resource and action capsule invalidation SSE feed
      operationId: resourceUpdates
      responses:
        "200":
          description: SSE stream. Named action_capsule events contain only {"refresh":true}; clients fetch tenant-scoped details from REST.
          content:
            text/event-stream:
              schema:
                type: string
  /v1/prompts:
    get:
      summary: List prompts
      operationId: listPrompts
      responses:
        "200":
          description: Prompt index with cache hints
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptsListResponse"
        "304":
          description: Not Modified (catalog unchanged)
  /v1/prompts/get:
    post:
      summary: Get prompt output
      operationId: getPrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetPromptRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Policy blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Prompt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/catalog/events:
    get:
      summary: Catalog mutation events change feed
      operationId: catalogEvents
      parameters:
        - in: query
          name: after
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Event log feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEventsResponse"
  /v1/completion/complete:
    post:
      summary: Argument completion for prompt or resource
      operationId: completeArgument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: Completion candidate results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResponse"
  /v1/sampling/create_message:
    post:
      summary: Sampling completion delegation
      operationId: samplingCreateMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamplingRequest"
      responses:
        "200":
          description: Sampling response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamplingResponse"
        "202":
          description: Sampling request accepted asynchronously
  /v1/sampling/requests:
    get:
      summary: List pending or completed sampling delegation tickets
      operationId: listSamplingRequests
      responses:
        "200":
          description: List of sampling tickets
  /v1/sampling/requests/{id}:
    get:
      summary: Get detailed status of a sampling delegation ticket
      operationId: getSamplingRequest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sampling ticket detail
        "404":
          description: Ticket not found
  /v1/sampling/requests/{id}/respond:
    post:
      summary: Provide client LLM completion to resolve a pending sampling ticket
      operationId: respondSamplingRequest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completion accepted
        "404":
          description: Ticket not found or not pending
  /v1/config:
    get:
      summary: Get active configuration and metrics
      operationId: getConfig
      responses:
        "200":
          description: Active configuration and runtime metrics
  /v1/config/servers:
    post:
      summary: Upsert upstream server with hot-mounting
      operationId: upsertServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertServerRequest"
      responses:
        "200":
          description: Server upserted and mounted
  /v1/config/servers/{id}:
    delete:
      summary: Delete upstream server and unmount dynamically
      operationId: deleteServer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server deleted and unmounted
  /v1/config/ecosystem:
    get:
      summary: Discover external MCP server configurations from Claude Desktop, Cursor, or Zed
      operationId: getEcosystemSources
      responses:
        "200":
          description: Discovered ecosystem configuration files and servers
  /v1/config/import:
    post:
      summary: Import MCP servers from external client configurations
      operationId: importConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportConfigRequest"
      responses:
        "200":
          description: Summary of imported servers
  /v1/config/alias:
    post:
      summary: Add or remove capability, resource, or prompt aliases
      operationId: updateAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAliasRequest"
      responses:
        "200":
          description: Alias updated
  /v1/config/policy:
    post:
      summary: Update security policy rules, approval requirements, and redaction keys
      operationId: updatePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyConfig"
      responses:
        "200":
          description: Policy updated
  /v1/config/reversibility/draft:
    post:
      summary: Generate a reversible contract draft as a trust administrator
      operationId: generateReversibilityDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReversibilityDraftRequest"
      responses:
        "200":
          description: Draft contract, observed capability revisions, and dynamic mappings requiring testing
        "400":
          description: The selected capabilities or mappings cannot form a draft
        "403":
          description: Trust administration authorization is required
  /v1/config/reversibility/record:
    post:
      summary: Run a confirmed contract test on the configured isolated source
      operationId: recordReversibilityDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draft, revisions, confirmationToken, confirmed]
              properties:
                draft:
                  $ref: "#/components/schemas/ReversibilityDraftRequest"
                revisions:
                  type: object
                  additionalProperties: {type: string}
                confirmationToken:
                  type: string
                confirmed:
                  const: true
      responses:
        "200":
          description: Verified cleanup, the tested draft, and a short-lived review token
        "403":
          description: Trust administration and undo permission are required
        "409":
          description: The test was unconfirmed, stale, or failed
  /v1/config/reversibility/activate:
    post:
      summary: Save a tested draft using its single-use review token
      operationId: activateReversibilityDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draft, revisions, reviewToken, alias]
              properties:
                draft:
                  $ref: "#/components/schemas/ReversibilityDraftRequest"
                revisions:
                  type: object
                  additionalProperties: {type: string}
                reviewToken:
                  type: string
                alias:
                  type: string
      responses:
        "200":
          description: Contract saved and reload attempted
        "202":
          description: Contract saved and reload needs attention
        "403":
          description: Trust administration authorization is required
        "409":
          description: Test evidence is stale, expired, or belongs to another draft
  /v1/config/reload:
    post:
      summary: Hot-reload daemon configuration and upstream servers from disk
      operationId: reloadConfig
      responses:
        "200":
          description: Summary of mounted, unmounted, and updated servers
  /v1/config/tool-pins:
    get:
      summary: Review upstream tool definitions and approvals as a trust administrator
      operationId: listToolPins
      responses:
        "200":
          description: Definitions from servers that require pins
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  pins:
                    type: array
                    items: {$ref: "#/components/schemas/ToolPin"}
        "403":
          description: Authenticated trust administrator required
  /v1/config/tool-pins/approve:
    post:
      summary: Persist approval of an exact observed upstream definition
      operationId: approveToolPin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server, tool, digest]
              properties:
                server: {type: string}
                tool: {type: string}
                digest: {type: string}
      responses:
        "200":
          description: Current pin review state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  pin: {$ref: "#/components/schemas/ToolPin"}
        "403":
          description: Authenticated trust administrator required
        "409":
          description: The observed definition changed or became unavailable
        "503":
          description: Audit authorization or pin persistence failed
  /v1/approvals:
    get:
      summary: List pending and resolved human approval tickets
      operationId: listApprovals
      responses:
        "200":
          description: List of approval tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListApprovalsResponse"
  /v1/approvals/{id}:
    get:
      summary: Get details and sanitized parameters for an approval ticket
      operationId: getApproval
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval ticket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetApprovalResponse"
        "404":
          description: Approval ticket not found
  /v1/approvals/{id}/approve:
    post:
      summary: Approve a suspended capability execution
      operationId: approveTicket
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveTicketRequest"
      responses:
        "200":
          description: Approval decision persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionReceiptResponse"
        "409":
          description: Ticket is not pending or already resolved
  /v1/approvals/{id}/reject:
    post:
      summary: Reject a suspended capability execution
      operationId: rejectTicket
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectTicketRequest"
      responses:
        "200":
          description: Rejection decision persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionReceiptResponse"
        "409":
          description: Ticket is not pending or already resolved
  /v1/webhooks/actions:
    post:
      summary: Resolve a purpose-bound signed ChatOps action
      operationId: applyChatOpsAction
      description: Resolves a signed approval, undo, or cancel-send action. Request bodies are limited to 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_token]
              properties:
                action_token: {type: string, maxLength: 512}
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                payload: {type: string}
      responses:
        "200":
          description: Signed action acknowledged or a JSON approval receipt returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionReceiptResponse"
        "400":
          description: Malformed callback payload
        "413":
          description: Callback body exceeds 64 KiB
        "401":
          description: Signed action or Slack request authentication failed
        "403":
          description: Configured role is not authorized
        "404":
          description: Action target is unavailable
        "409":
          description: Competing decision or expired approval
        "503":
          description: Decision could not be durably persisted
  /v1/webhooks/callbacks:
    post:
      summary: Retired approval callback
      operationId: retiredApprovalCallback
      deprecated: true
      responses:
        "410":
          description: Use /v1/webhooks/actions
  /v1/audit/events:
    get:
      summary: Query paginated WORM audit events with filters
      operationId: listAuditEvents
      parameters:
        - in: query
          name: actor_id
          schema:
            type: string
        - in: query
          name: capability_id
          schema:
            type: string
        - in: query
          name: event_type
          schema:
            type: string
            description: Includes emission_held and emission_cancelled for delayable task lifecycle events
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of audit events
  /v1/audit/events/{id}:
    get:
      summary: Get details of a single audit event record
      operationId: getAuditEvent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit event record
        "404":
          description: Audit event not found
  /v1/audit/verify:
    get:
      summary: Verify the audit hash chain
      description: File-backed logs are checked from disk. For an in-memory log after eviction, the report includes the zero-based first_retained_index of the verified suffix.
      operationId: verifyAuditChain
      responses:
        "200":
          description: Hash chain verification report
  /v1/audit/stats:
    get:
      summary: Retrieve summary metrics and event breakdown of the audit log
      operationId: getAuditStats
      responses:
        "200":
          description: Aggregate audit statistics
  /v1/audit/export:
    get:
      summary: Export raw audit log as JSONL or CSV file attachment
      operationId: exportAuditLog
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [jsonl, csv]
            default: jsonl
      responses:
        "200":
          description: Streamed audit log file
  /v1/undo:
    get:
      summary: List tenant-owned undo entries
      operationId: listUndoEntries
      parameters:
        - in: query
          name: work_item_id
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [armed, executing, reverted, expired, failed] }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Tenant-owned entries in reverse creation order, with reverse registration order breaking ties.
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: { type: boolean }
                  result:
                    $ref: "#/components/schemas/UndoListResponse"
        "403": { description: Role lacks undo list permission }
  /v1/undo/test:
    post:
      summary: Test an inverse contract on its configured test server
      operationId: testUndoContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias]
              properties:
                alias: { type: string }
              additionalProperties: false
      responses:
        "200": { description: Forward and inverse completed and state matched the original snapshot }
        "400": { description: Alias lacks an explicit testTarget or preSnapshot contract }
        "403": { description: Role is not authorized or policy denies the contract }
        "409": { description: Inverse failed or state did not return to its snapshot }
        "502": { description: Forward, inverse, snapshot, or verification call failed }
  /v1/undo/{undo_id}:
    get:
      summary: Show one tenant-owned undo entry
      operationId: getUndoEntry
      parameters:
        - in: path
          name: undo_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Safe undo summary
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: { type: boolean }
                  result:
                    $ref: "#/components/schemas/UndoEntrySummary"
        "404": { description: Entry is missing or belongs to another tenant }
  /v1/undo/{undo_id}/execute:
    post:
      summary: Execute one undo entry
      operationId: executeUndoEntry
      parameters:
        - in: path
          name: undo_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forceExpired: { type: boolean, default: false }
                reason: { type: string }
              additionalProperties: false
      responses:
        "200":
          description: Inverse outcome and committed audit receipt
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: { type: boolean }
                  result:
                    $ref: "#/components/schemas/RollbackResult"
        "502": { description: Inverse execution failed }
        "503": { description: Undo storage unavailable or audit persistence failed }
        "404": { description: Entry is missing or belongs to another tenant }
        "409": { description: Entry is expired or not executable }
        "403": { description: Role lacks required permission }
  /v1/undo/work-items/{work_item_id}/rollback:
    post:
      summary: Roll back eligible entries for a work item in reverse order
      operationId: rollbackWorkItem
      parameters:
        - in: path
          name: work_item_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forceExpired: { type: boolean, default: false }
                reason: { type: string }
              additionalProperties: false
      responses:
        "200":
          description: Per-entry rollback outcomes across the entire work item. Check each result even when HTTP status is 200.
          content:
            application/json:
              schema:
                type: object
                required: [ok, results]
                properties:
                  ok: { type: boolean }
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/RollbackResult"
        "404": { description: Work item belongs to another tenant }
        "503": { description: Undo storage unavailable or an audit event could not be committed }
        "403": { description: Role lacks rollback permission }
  /v1/tasks:
    get:
      summary: List tasks visible to the current tenant and profile
      operationId: listTasks
      responses:
        "200":
          description: Visible task receipts
          content:
            application/json:
              schema:
                type: object
                required: [ok, total, tasks]
                properties:
                  ok:
                    type: boolean
                  total:
                    type: integer
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskResponse"
  /v1/tasks/{id}:
    get:
      summary: Get a task receipt
      operationId: getTask
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  task:
                    $ref: "#/components/schemas/TaskResponse"
        "404":
          description: Task not found or not visible to this caller
  /v1/tasks/{id}/update:
    post:
      summary: Submit input responses to a suspended task
      description: Submit input in the task's tenant and profile scope. Approval tasks require an explicit Boolean decision.
      operationId: updateTask
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Warmplane-Profile
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputResponses]
              properties:
                inputResponses:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Task input accepted
        "400":
          description: Task is not waiting for input
  /v1/tasks/{id}/cancel:
    post:
      summary: Cancel a task or pending emission
      operationId: cancelTask
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: [string, "null"]
      responses:
        "200":
          description: Task cancelled; repeated emission cancellation is idempotent
        "409":
          description: Emission dispatch was already claimed and may have reached the upstream server
        "404":
          description: Task not found or not visible to this caller
  /v1/operations/{id}/cancel:
    post:
      summary: Cancel in-flight operation
      operationId: cancelOperation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Operation cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                  cancelled:
                    type: boolean
        "409":
          description: Emission dispatch has already started
