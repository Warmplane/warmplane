# Slop Gate policy. Missing values use warning-only defaults.
version = 1

[rules.function_mass]
severity = "warn"          # off | warn | error
new_function_limit = 80.0
delta_limit = 20.0

[rules.near_clone]
severity = "warn"          # off | warn | error
minimum_sloc = 8
minimum_tokens = 40
similarity_threshold = 0.85
max_candidates = 64
detect_blocks = true       # duplicated statement blocks inside large functions
block_max_candidates = 256 # wider budget than whole-function comparison
block_max_families = 3     # blocks reported per function
# block_minimum_tokens = 120  # defaults to 3x minimum_tokens

[rules.lint_suppression]
severity = "warn"

[rules.unsafe_surface]
severity = "warn"

[rules.dependency_surface]
severity = "warn"

[rules.structural_erosion]
severity = "warn"
erosion_limit = 0.50
delta_limit = 0.08
mass_growth_limit = 0.08   # growth of absolute high-complexity mass
complexity_cutoff = 10
top_contributors = 3

# Add an exact-location exception only after review.
# [[suppressions]]
# rule = "near-clone"
# path = "src/compat.rs"
# line = 42
# reason = "Protocol compatibility requires this implementation."

[[suppressions]]
rule = "dependency-surface-growth"
path = "Cargo.toml"
line = 44
reason = "Reviewed regex 1.13.1 against RustSec. Result sanitization uses bounded RegexSet compilation and existence matching with a shared inspection budget."

[[suppressions]]
rule = "dependency-surface-growth"
path = "Cargo.toml"
line = 45
reason = "Reviewed serde-saphyr for bounded OpenAPI YAML deserialization with parser features restricted to deserialize."

[[suppressions]]
rule = "dependency-surface-growth"
path = "Cargo.toml"
line = 46
reason = "Reviewed ipnet for validating operator-configured CIDR restrictions on remote OpenAPI specification fetches."
