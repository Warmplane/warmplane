
[package]
name = "warmplane"
version = "0.35.0"
edition = "2021"
description = "Local control plane that keeps MCP sessions warm with compact capability/resource/prompt facades."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Warmplane/warmplane"
homepage = "https://github.com/Warmplane/warmplane"
keywords = ["mcp", "agent", "cli", "proxy", "orchestration"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# MCP protocol
rmcp = { version = "3.11.0", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }

# Async runtime & HTTP
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
axum = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "stream"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }

# CLI & Data
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inquire = "0.7"
colored = "2.1"
anyhow = "1.0"
tempfile = "3.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
regex = "1.13"
serde-saphyr = { version = "1.2", default-features = false, features = ["deserialize"] }
ipnet = "2.12"
subtle = "2.6"
fastembed = { version = "4.5", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[features]
default = []
semantic-search = ["dep:fastembed", "dep:openssl"]

[lib]
name = "warmplane"
path = "src/lib.rs"

[[bin]]
name = "warmplane"
path = "src/main.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
tower = { version = "0.5", features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false }

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "catalog_bench"
harness = false

[[bench]]
name = "idempotency_bench"
harness = false

[[bench]]
name = "facade_bench"
harness = false
