<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warmplane Control Deck</title>
  <style>
:root {
  --bg-app: #0c0d10;
  --surface: #13151a;
  --surface-card: #181b22;
  --surface-hover: #1f232c;
  --surface-elevated: #242934;
  
  --border: #262b36;
  --border-focus: #e58b20;
  --border-subtle: #1c202a;

  --amber-300: #fbbf24;
  --amber-400: #f59e0b;
  --amber-500: #d97706;
  --amber-glow: rgba(245, 158, 11, 0.15);

  --green-400: #34d399;
  --red-400: #f87171;
  --cyan-400: #22d3ee;
  
  --text-main: #f3f4f6;
  --text-muted: #9ca3af;
  --text-dim: #6b7280;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  
  --ff-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ff-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: var(--ff-sans);
  font-size: 13px;
  line-height: 1.5;
  display: flex;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg-app);
}
::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--surface-elevated);
}

/* Typography & Badges */
code, pre {
  font-family: var(--ff-mono);
}

.brand-badge {
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
  background: rgba(245, 158, 11, 0.12);
  color: var(--amber-400);
  border: 1px solid rgba(245, 158, 11, 0.25);
  font-family: var(--ff-mono);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  font-family: var(--ff-sans);
}

.btn-primary {
  background: var(--amber-500);
  color: #000;
  font-weight: 600;
}
.btn-primary:hover {
  background: var(--amber-400);
  box-shadow: 0 0 12px var(--amber-glow);
}

.btn-ghost {
  background: var(--surface-card);
  color: var(--text-main);
  border-color: var(--border);
}
.btn-ghost:hover {
  background: var(--surface-hover);
  border-color: var(--text-dim);
}

.btn-danger {
  background: rgba(248, 113, 113, 0.1);
  color: var(--red-400);
  border-color: rgba(248, 113, 113, 0.25);
}
.btn-danger:hover {
  background: rgba(248, 113, 113, 0.2);
}

/* Form inputs */
.form-group {
  margin-bottom: 14px;
}

.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.form-input, .form-textarea, select.form-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-main);
  font-family: var(--ff-mono);
  font-size: 12px;
  transition: border-color 0.15s;
}

.form-input:focus, .form-textarea:focus, select.form-input:focus {
  outline: none;
  border-color: var(--amber-400);
  box-shadow: 0 0 0 2px var(--amber-glow);
}

/* Bento Grid */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}

.bento-card {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  position: relative;
  transition: border-color 0.2s;
}

.col-3 { grid-column: span 3; }
.col-4 { grid-column: span 4; }
.col-6 { grid-column: span 6; }
.col-8 { grid-column: span 8; }
.col-12 { grid-column: span 12; }

.stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  font-family: var(--ff-mono);
  color: var(--text-main);
  margin: 6px 0 2px;
}

.stat-sub {
  font-size: 11px;
  color: var(--text-dim);
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal-backdrop.active {
  display: flex;
}

.modal-box {
  width: 540px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.8);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.modal-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
}

</style>
  <style>
    .ambient-glow {
      position: fixed;
      top: -150px;
      right: 15%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.07) 0%, rgba(12, 13, 16, 0) 70%);
      pointer-events: none;
      z-index: 0;

    aside.sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--amber-400), var(--amber-500));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 15px;
    }

    .nav-group-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 8px 10px 4px;
      letter-spacing: 0.5px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      transition: all 0.15s ease;
      margin-bottom: 2px;
    }

    .nav-item:hover {
      background: var(--surface-hover);
      color: var(--text-main);
    }

    .nav-item.active {
      background: var(--surface-card);
      color: var(--amber-400);
      font-weight: 600;
      border-left: 2.5px solid var(--amber-400);
    }

    .nav-item svg {
      width: 16px;
      height: 16px;
    }

    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .top-bar {
      height: 52px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(19, 21, 26, 0.7);
      backdrop-filter: blur(8px);
    }

    .content-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .cap-item {
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-bottom: 2px;
      transition: all 0.15s ease;
    }

    .cap-item:hover {
      background: var(--surface-hover);
    }

    .cap-item.active {
      background: var(--surface-card);
      border-left: 2px solid var(--amber-400);
    }

    .feed-row {
      display: grid;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      align-items: center;
      font-size: 11.5px;
    }
  </style>
</head>

  <div class="ambient-glow"></div>

  <!-- SIDEBAR -->

  </aside>

    <header class="top-bar">
